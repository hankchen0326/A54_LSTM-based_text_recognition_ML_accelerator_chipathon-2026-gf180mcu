# Pin order follows the organizer's upper-left-quadrant convention:
# clockwise from the fixed quiet-ground pad at the bottom-left to the top-right.
project:
  title: "16-Lane INT8 LSTM Accelerator"
  team: "A54_Waibibabu"
  discord: "cissy07838"
  description: "A GF180MCU 16-lane INT8 LSTM accelerator in the organizer-supplied 1110 um x 1110 um A54 A-block wrapper."
  lvs_config: "lvs_config.json"

pins:
  - name: VSS
    io_type: ground
  - name: VDD
    io_type: power
  - name: "rsp_data[0]"
    io_type: bidirectional
  - name: "rsp_data[1]"
    io_type: bidirectional
  - name: "rsp_data[2]"
    io_type: bidirectional
  - name: "rsp_data[3]"
    io_type: bidirectional
  - name: "rsp_data[4]"
    io_type: bidirectional
  - name: "rsp_data[5]"
    io_type: bidirectional
  - name: "rsp_data[6]"
    io_type: bidirectional
  - name: "rsp_data[7]"
    io_type: bidirectional
  - name: rsp_valid
    io_type: bidirectional
  - name: clk
    io_type: input_schmitt
  - name: rst_n
    io_type: input_schmitt
  - name: cmd_valid
    io_type: input_cmos
  - name: "cmd_data[0]"
    io_type: input_cmos
  - name: "cmd_data[1]"
    io_type: input_cmos
  - name: "cmd_data[2]"
    io_type: input_cmos
  - name: "cmd_data[3]"
    io_type: input_cmos
  - name: "cmd_data[4]"
    io_type: input_cmos
  - name: "cmd_data[5]"
    io_type: input_cmos
  - name: "cmd_data[6]"
    io_type: input_cmos
  - name: "cmd_data[7]"
    io_type: input_cmos

# VSS is first because the organizer reserves the first quadrant pad for quiet
# ground. VDD follows it so the only power domain has an adjacent return pad.
